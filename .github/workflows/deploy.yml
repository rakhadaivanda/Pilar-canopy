name: Deploy to Company VPS

on:
  push:
    branches: [ "main" ] # Sesuaikan jika branch utama Kakak "master"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Executing remote SSH deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # 1. Masuk ke direktori project yang benar di VPS
          cd /var/www/dashboard-canopy

          # 2. Ambil update kode terbaru dari GitHub
          git pull origin main

          # 3. Install dependencies & build project
          npm install
          npm run build

          # 4. Restart aplikasi menggunakan PM2
          pm2 restart all